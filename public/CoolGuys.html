<body>
    <h2>HEY CLICK THIS COOL GUY</h2>
<button id="ASong" onClick="playPause()">
  <audio
    src="../Assets/coolguy.mp3"
    autoplay
  ></audio>
  <img width="300" height="550"    src="../Assets/Cool Guy.jpg" alt="What the hell are you talking about?"/>
</button>

<script>
  var aud = document.getElementById("ASong").children[0];
  var isPlaying = false;
  aud.pause();

  function playPause() {
    if (isPlaying) {
      aud.pause();
    } else {
      aud.play();
    }
    isPlaying = !isPlaying;
  }
</script>
